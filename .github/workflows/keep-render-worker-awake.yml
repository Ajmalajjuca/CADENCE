name: Keep Render worker awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check worker health
        run: >-
          curl --fail --silent --show-error
          --retry 3 --retry-all-errors --retry-delay 5
          --connect-timeout 10 --max-time 20
          https://cadence-3iwy.onrender.com/health
